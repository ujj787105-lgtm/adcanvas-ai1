<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdCanvas AI Studio</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { min-height: 100vh; display: flex; flex-direction: column; background: #ebecf0; }
    .topbar { height: 52px; background: linear-gradient(90deg, #00c4cc, #5a32fa, #7d2ae8); color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; }
    .brand { font-weight: 700; font-size: 16px; }
    .top-actions { display: flex; gap: 6px; align-items: center; }
    .btn { border: none; padding: 7px 11px; border-radius: 8px; font-weight: 600; font-size: 12px; cursor: pointer; }
    .btn-white { background: #fff; color: #18191b; }
    .btn-run { background: #10b981; color: #fff; }
    .btn-primary { background: #7d2ae8; color: #fff; width: 100%; padding: 10px; font-size: 13px; }
    .workspace { display: flex; flex: 1; }
    .rail { width: 64px; background: #18191b; color: #9ca3af; display: flex; flex-direction: column; align-items: center; padding: 10px 4px; gap: 8px; }
    .rail-item { width: 54px; padding: 8px 2px; border-radius: 8px; text-align: center; font-size: 10px; cursor: pointer; }
    .rail-item.active { color: #fff; background: #252629; border-left: 3px solid #7d2ae8; }
    .rail-item span { display: block; font-size: 18px; }
    .drawer { width: 290px; background: #252629; color: #f9fafb; padding: 14px; }
    .drawer h3 { font-size: 14px; margin-bottom: 10px; }
    .drawer label { font-size: 11px; color: #9ca3af; display: block; margin-bottom: 4px; }
    .drawer input { width: 100%; background: #18191b; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 6px; font-size: 12px; margin-bottom: 10px; }
    .elem-btn { width: 100%; text-align: left; background: #323438; color: #fff; border: 1px solid #444; padding: 10px; border-radius: 8px; margin-bottom: 8px; cursor: pointer; font-size: 12px; }
    .editor-area { flex: 1; display: flex; flex-direction: column; }
    .prop-bar { height: 42px; background: #fff; border-bottom: 1px solid #ddd; display: flex; align-items: center; padding: 0 12px; gap: 8px; }
    .prop-btn { background: #f3f4f6; border: none; padding: 5px 9px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
    .stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 14px; }
    .canvas-shadow { box-shadow: 0 8px 24px rgba(0,0,0,0.18); background: #fff; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: none; align-items: center; justify-content: center; z-index: 99; }
    .modal-backdrop.open { display: flex; }
    .modal { background: #fff; width: 620px; max-width: 94vw; max-height: 90vh; overflow-y: auto; border-radius: 12px; }
    .modal-head { background: #18191b; color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; }
    .modal-body { padding: 16px; display: grid; grid-template-columns: 170px 1fr; gap: 14px; }
    .modal-body img { width: 100%; border-radius: 8px; border: 1px solid #ddd; }
    .modal-body label { font-size: 11px; font-weight: 600; color: #4b5563; display: block; margin-bottom: 3px; }
    .modal-body input, .modal-body textarea { width: 100%; padding: 7px; border: 1px solid #ccc; border-radius: 6px; font-size: 12px; margin-bottom: 8px; }
    .modal-foot { padding: 12px 16px; background: #f9fafb; display: flex; justify-content: flex-end; gap: 8px; }
    .hidden { display: none; }
    @media (max-width: 768px) {
      .workspace { flex-direction: column-reverse; }
      .rail { width: 100%; flex-direction: row; justify-content: center; }
      .rail-item.active { border-left: none; border-bottom: 3px solid #7d2ae8; }
      .drawer { width: 100%; }
      .modal-body { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">🎨 AdCanvas AI</div>
    <div class="top-actions">
      <button class="btn btn-white" onclick="downloadPoster()">⬇️ PNG</button>
      <button class="btn btn-run" onclick="openAdModal()">🚀 Run Ad</button>
    </div>
  </header>

  <div class="workspace">
    <nav class="rail">
      <div class="rail-item active" onclick="switchTab('ai', this)"><span>✨</span>AI Agent</div>
      <div class="rail-item" onclick="switchTab('text', this)"><span>🔤</span>Text</div>
    </nav>

    <aside class="drawer">
      <div id="tab-ai">
        <h3>✨ AI Logo & Poster Agent</h3>
        <label>Gemini API Key (Optional)</label>
        <input id="geminiKey" type="password" placeholder="AIza... (Blank = Free Template)" />
        <label>Brand Name</label>
        <input id="aiBrand" type="text" value="Urban Brew Cafe" />
        <label>Offer / Headline</label>
        <input id="aiOffer" type="text" value="BUY 1 GET 1 FREE" />
        <label>Sub-detail</label>
        <input id="aiSub" type="text" value="Fresh Coffee • Order Today" />
        <button id="genBtn" class="btn btn-primary" onclick="runAIAgent()">⚡ Generate Logo + Poster</button>
        <div style="margin-top:10px; background:#18191b; padding:10px; border-radius:8px;">
          <label style="color:#a78bfa;">Ad Caption:</label>
          <p id="captionBox" style="font-size:11px; color:#d1d5db;">☕ Urban Brew Cafe par paayein BUY 1 GET 1 FREE!</p>
        </div>
      </div>

      <div id="tab-text" class="hidden">
        <h3>🔤 Add Elements</h3>
        <button class="elem-btn" onclick="addText('50% OFF TODAY', 28, true)">+ Add Heading</button>
        <button class="elem-btn" onclick="addText('Limited Time Deal', 16, false)">+ Add Subheading</button>
        <button class="elem-btn" onclick="addCTAButton('#10b981', '#fff')">+ Add SHOP NOW Button</button>
      </div>
    </aside>

    <main class="editor-area">
      <div class="prop-bar">
        <input type="color" value="#ffffff" onchange="changeColor(this.value)" style="width:26px;height:26px;border:none;cursor:pointer;">
        <button class="prop-btn" onclick="changeSize(3)">A+</button>
        <button class="prop-btn" onclick="changeSize(-3)">A-</button>
        <button class="prop-btn" style="color:#dc2626;" onclick="deleteObj()">🗑️ Delete</button>
      </div>
      <div class="stage">
        <div class="canvas-shadow"><canvas id="c"></canvas></div>
      </div>
    </main>
  </div>

  <div class="modal-backdrop" id="adModal">
    <div class="modal">
      <div class="modal-head">
        <h3>📢 Launch Meta Ad</h3>
        <button onclick="closeAdModal()" style="background:none;border:none;color:#fff;font-size:16px;cursor:pointer;">✕</button>
      </div>
      <div class="modal-body">
        <div><img id="adPreviewImg" src="" /></div>
        <div>
          <label>Meta Access Token</label><input id="metaToken" type="password" placeholder="EAAB..." />
          <label>Ad Account ID</label><input id="adAccountId" type="text" placeholder="act_123456" />
          <label>Facebook Page ID</label><input id="pageId" type="text" placeholder="10293847..." />
          <label>Ad Headline</label><input id="modalHeadline" type="text" />
          <label>Ad Caption</label><textarea id="modalCaption" rows="2"></textarea>
          <label>Daily Budget (INR ₹)</label><input id="modalBudget" type="number" value="500" />
          <label>Website / WhatsApp Link</label><input id="modalUrl" type="text" value="https://wa.me/919999999999" />
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" onclick="closeAdModal()">Cancel</button>
        <button id="launchBtn" class="btn btn-run" onclick="launchMetaAd()">✅ Publish Ad</button>
      </div>
    </div>
  </div>
